[package]
name = "aidash-marketplace-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "aidash-marketplace-server"

[lints]
workspace = true

[dependencies]
aidash-domain.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
ctor = "0.6"
http = "1"
linkme = "0.3"
openidconnect = "4.0.1"
percent-encoding = "2"
reinhardt = { workspace = true, features = [
  "minimal",
  "database",
  "db-postgres",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
url = "2"
uuid.workspace = true

[dev-dependencies]
reinhardt = { workspace = true, features = ["test", "testcontainers"] }

[[bin]]
name = "aidash-marketplace-server"
path = "src/bin/manage.rs"
