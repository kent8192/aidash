[package]
name = "aidash-marketplace-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "3"

[dependencies]
reinhardt = { package = "reinhardt-web", git = "https://github.com/kent8192/reinhardt-web", rev = "b6a006a769ca340c22a51e67fef1bb4be1dc3039", default-features = false, features = [
  "pages",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.6"
gloo-events = "0.2"
js-sys = "0.3"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlFormElement",
  "FormData",
  "File",
  "FileList",
  "Blob",
  "Event",
  "EventTarget",
  "Location",
  "RequestCredentials",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
