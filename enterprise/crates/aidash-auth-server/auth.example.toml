# Non-secret example. Mount every referenced credential separately.
issuer = "https://auth.example.com"
listen = "0.0.0.0:8081"
database_url_file = "/run/secrets/auth-database-url"
schema = "aidash_auth"
gcip_project = "replace-with-gcip-project"
gcip_tenants = ["replace-with-shared-pool"]
gcip_browser_api_key = "replace-with-public-firebase-api-key"
gcip_auth_domain = "replace-with-gcip-project.firebaseapp.com"
gcip_password_sign_up = false
gcip_mfa_mandatory = []
signing_key_file = "/run/secrets/auth-signing-key.pem"
signing_key_id = "auth-key-1"
# Base64-encoded 32 random bytes; used for the bounded refresh-response retry cache.
token_encryption_key_file = "/run/secrets/auth-token-encryption-key"
assets_dir = "/app/auth-web"
loopback_development = false
# Only the exact IPs of a trusted HTTPS reverse proxy; never trust arbitrary
# forwarded headers. A co-located edge can use loopback.
trusted_proxy_ips = ["127.0.0.1"]

[gcip_providers]
replace-with-shared-pool = ["google.com", "password"]

[[clients]]
id = "cloud"
redirect_uri = "https://cloud.example.com/auth/callback"
secret_file = "/run/secrets/cloud-client-secret"
introspection_secret_file = "/run/secrets/cloud-resource-secret"

[[clients]]
id = "marketplace"
redirect_uri = "https://marketplace.example.com/auth/callback"
secret_file = "/run/secrets/marketplace-client-secret"
introspection_secret_file = "/run/secrets/marketplace-resource-secret"

[grpc]
listen = "0.0.0.0:9091"
certificate_file = "/run/secrets/auth-tls/tls.crt"
private_key_file = "/run/secrets/auth-tls/tls.key"
client_ca_file = "/run/secrets/auth-client-ca.pem"
administrator_peers = ["spiffe://aidash/authentication-administration"]
# Source restoration remains separate from common Account administration.
source_restore_clients = ["cloud"]

[grpc.product_peers]
cloud = "spiffe://aidash/cloud"
