{{- $name := include "environment.name" . -}}
{{- $secret := required "postgres.existingSecret is required" .Values.postgres.existingSecret -}}
{{- $memory := .Values.postgres.resources.limits.memory | toString -}}
{{- if not (regexMatch "^([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+|[KMGTPE]i|[numkMGTPE])?$" $memory) -}}
  {{- fail "postgres.resources.limits.memory must be a positive Kubernetes memory quantity" -}}
{{- end -}}
{{- /* PostgreSQL's MB settings use MiB. Convert both binary and decimal Kubernetes units. */ -}}
{{- $unit := regexFind "([KMGTPE]i|[numkMGTPE])$" $memory -}}
{{- $scales := dict "Ki" 1024 "Mi" 1048576 "Gi" 1073741824 "Ti" 1099511627776 "Pi" 1125899906842624 "Ei" 1152921504606846976 "n" 0.000000001 "u" 0.000001 "m" 0.001 "k" 1000 "M" 1000000 "G" 1000000000 "T" 1000000000000 "P" 1000000000000000 "E" 1000000000000000000 -}}
{{- $bytes := mulf (trimSuffix $unit $memory | float64) (get $scales $unit | default 1) -}}
{{- $memoryMiB := divf $bytes 1048576 -}}
{{- $sharedMiB := int .Values.postgres.sharedBuffersMiB -}}
{{- $backendMiB := int .Values.postgres.activeBackendMiB -}}
{{- if or (lt $sharedMiB 1) (lt $backendMiB 1) -}}
  {{- fail "postgres.sharedBuffersMiB and postgres.activeBackendMiB must be positive" -}}
{{- end -}}
{{- /* Leave 25% of the memory limit for PostgreSQL and workload variance. */ -}}
{{- $maxConnections := divf (subf (mulf $memoryMiB 0.75) $sharedMiB) $backendMiB | int -}}
{{- if lt $maxConnections 1 -}}
  {{- fail "PostgreSQL memory limit leaves no connections after shared_buffers and 25% headroom" -}}
{{- end -}}
{{- range $role := list "postgres" "nats" }}
{{- $settings := index $.Values $role }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" (toString $settings.image)) -}}{{ fail (printf "%s.image must be pinned by digest: it runs with the retained %s volume" $role $role) }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $role }}
spec:
  clusterIP: None
  selector: { aidash.run/dependency: {{ $role }}, app.kubernetes.io/instance: {{ $.Release.Name | quote }} }
  ports:
    - { name: client, port: {{ ternary 5432 4222 (eq $role "postgres") }}, targetPort: client }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-{{ $role }}
spec:
  replicas: 1
  serviceName: {{ $name }}-{{ $role }}
  persistentVolumeClaimRetentionPolicy: { whenDeleted: Retain, whenScaled: Retain }
  selector: { matchLabels: { aidash.run/dependency: {{ $role }}, app.kubernetes.io/instance: {{ $.Release.Name | quote }} } }
  template:
    metadata:
      labels: { aidash.run/dependency: {{ $role }}, app.kubernetes.io/instance: {{ $.Release.Name | quote }} }
    spec:
      hostNetwork: false
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml $.Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $role }}
          image: {{ $settings.image | quote }}
          ports: [{ name: client, containerPort: {{ ternary 5432 4222 (eq $role "postgres") }} }]
          resources: {{ toYaml $settings.resources | nindent 12 }}
          {{- if eq $role "postgres" }}
          envFrom: [{ secretRef: { name: {{ $secret | quote }} } }]
          args:
            - "-c"
            - {{ printf "shared_buffers=%dMB" $sharedMiB | quote }}
            - "-c"
            - {{ printf "max_connections=%d" $maxConnections | quote }}
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          readinessProbe:
            exec: { command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          {{- else }}
          args: [-js, -sd, /data]
          readinessProbe: { tcpSocket: { port: client }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data }]
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: { helm.sh/resource-policy: keep }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $.Values.storage.className | quote }}
        resources: { requests: { storage: {{ $settings.size }} } }
{{- end }}
---
# Namespace isolation for the retained dependencies; no cross-Environment ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-dependencies
spec:
  podSelector: { matchExpressions: [{ key: aidash.run/dependency, operator: Exists }] }
  policyTypes: [Ingress]
  ingress:
    - from:
        # The controller's one-shot migration Job runs the app image as `migration`.
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [server, worker, migration] }] }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 4222 }
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: egress } }
      ports:
        - { protocol: TCP, port: 5432 }
    # The activity observer reads PostgreSQL only; unauthenticated NATS stays
    # limited to the application, so a compromised observer cannot touch JetStream.
    - from:
        - podSelector: { matchLabels: { aidash.run/activity: {{ .Release.Name | quote }} } }
      ports:
        - { protocol: TCP, port: 5432 }
    # Recovery Jobs use their read-only login and never connect to NATS.
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/component, operator: In, values: [memory-backup, memory-prune] }] }
      ports:
        - { protocol: TCP, port: 5432 }
{{- if (include "environment.workloadKind" $ | eq "StatefulSet") | and $.Values.highAvailability.enabled }}
{{- range $role := list "postgres" "nats" "edge" }}
---
{{ include "environment.highAvailability" (dict "name" (printf "%s-%s" $name $role) "seconds" $.Values.highAvailability.afterNodeUnreachableSeconds) }}
{{- end }}
{{- end }}
