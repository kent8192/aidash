[package]
name = "aidash-auth-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reinhardt = { package = "reinhardt-web", git = "https://github.com/kent8192/reinhardt-web", rev = "b6a006a769ca340c22a51e67fef1bb4be1dc3039", default-features = false, features = [
  "pages",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Url",
  "UrlSearchParams",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Headers",
  "Response",
  "Event",
  "HtmlSelectElement",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
