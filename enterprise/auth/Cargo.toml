[package]
name = "aidash-auth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "aidash-auth-server"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ctor = "0.6"
linkme = "0.3"
inventory = "0.3"

[build-dependencies]
cfg_aliases = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aidash-application.workspace = true
aidash-domain.workspace = true
aidash-gcp.workspace = true
aidash-integrations = { workspace = true, features = ["authentication"] }
async-trait.workspace = true
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
chrono.workspace = true
http = "1"
reinhardt = { workspace = true, features = [
  "minimal",
  "pages",
  "client-router",
  "db-postgres",
  "auth-oidc-op",
  "argon2-hasher",
  "grpc-tls",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
thiserror = "2"
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reinhardt-test = { git = "https://github.com/kent8192/reinhardt-web", rev = "b6a006a769ca340c22a51e67fef1bb4be1dc3039", default-features = false, features = [
  "e2e",
] }
jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
aidash-marketplace-server = { path = "../marketplace" }
reinhardt = { workspace = true, features = ["test", "testcontainers"] }
rstest.workspace = true
rcgen = "0.14.8"

[[bin]]
name = "aidash-auth-server"
path = "src/bin/manage.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reinhardt = { package = "reinhardt-web", git = "https://github.com/kent8192/reinhardt-web", rev = "b6a006a769ca340c22a51e67fef1bb4be1dc3039", default-features = false, features = [
  "pages",
  "client-router",
] }


js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Url",
  "UrlSearchParams",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Headers",
  "Response",
  "Event",
  "HtmlSelectElement",
] }


[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["client-router"]
client-router = []
browser-e2e = []
