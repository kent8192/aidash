[package]
name = "aidash-enterprise-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "aidash"

[lib]
name = "aidash_enterprise_server"

[lints]
workspace = true

[[bin]]
name = "aidash"
path = "src/bin/aidash.rs"

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[dependencies]
aidash-application.workspace = true
aidash-domain.workspace = true
aidash-gcp = { workspace = true, features = ["cloud"] }
aidash-server.workspace = true
async-trait.workspace = true
chrono.workspace = true
# The ORM and route macros register through these.
ctor = "0.6"
linkme = "0.3"
http = "1"
indexmap = "2"
reinhardt.workspace = true
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
url = "2"
uuid.workspace = true

[dev-dependencies]
aidash-broker = { workspace = true, features = ["test-support"] }
# The Community server's test support needs the test-only ports (ADR 0006).
aidash-application = { workspace = true, features = ["test-support"] }
aidash-capability.workspace = true
aidash-integrations = { workspace = true, features = ["test-support"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util.workspace = true
jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
regex = "1.12"
secrecy = "0.10"
reinhardt = { workspace = true, features = ["test", "testcontainers"] }
rstest.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
toml = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"
