{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
spec:
  secretName: {{ required "certificate.secretName is required" .Values.certificate.secretName }}
  issuerRef:
    name: {{ required "certificate.issuerRef.name is required" .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  privateKey:
    rotationPolicy: Always
  dnsNames: {{ .Values.certificate.dnsNames | toJson }}
  uris: {{ .Values.certificate.uris | toJson }}
  usages: {{ .Values.certificate.usages | toJson }}
{{- end }}
