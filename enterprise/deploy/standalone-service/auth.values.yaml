# Build enterprise/auth/Dockerfile from the repository root.
port: 8081
args: ["--config", "/run/aidash/config/auth.toml", "serve"]
grpc:
  enabled: true
  port: 9091
# trusted_proxy_ips in auth.toml (the config Secret) must name the edge; every peer in
# a trusted network may assert forwarded HTTPS, so networkPolicy admits only the edge
# Pods to the HTTP port. Browsers, Marketplace (/oauth/token, /oauth/introspect,
# /oauth/revoke at its AIDASH_AUTH_ISSUER origin) and Cloud's OIDC flow all arrive
# through the edge. Kubelet probes are node-originated and always admitted by GKE
# Dataplane V2.
#
# The gRPC/mTLS port is private. Its callers are Cloud's server and worker Pods
# (app.kubernetes.io/instance=app, component server|worker, in the Cloud environment's
# namespace) and the separate Account-administration workload; the standalone services
# are not yet deployed from enterprise/infra/gcp (Issue #516), so the namespaces and the
# administration labels below are PLACEHOLDERS that match nothing until replaced.
# mTLS and per-peer permissions still apply on top of this reachability limit.
networkPolicy:
  enabled: true
  ingress:
    - port: http
      from:
        - podSelector:
            matchLabels:
              aidash.run/edge: env
    - port: grpc
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_CLOUD_NAMESPACE
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [server, worker]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_ADMINISTRATION_NAMESPACE
          podSelector:
            matchLabels:
              aidash.run/authentication-admin: REPLACE_WITH_ADMINISTRATION_WORKLOAD
secretVolumes:
  - name: configuration
    secretName: authentication-config
    mountPath: /run/aidash/config
  - name: credentials
    secretName: authentication-runtime
    mountPath: /run/secrets
  - name: grpc-tls
    secretName: authentication-tls
    mountPath: /run/secrets/auth-tls
certificate:
  enabled: true
  secretName: authentication-tls
  issuerRef:
    name: aidash-services
    kind: ClusterIssuer
  dnsNames: [authentication.internal]
  usages: [server auth]
