# Build enterprise/marketplace/Dockerfile from the repository root.
port: 8082
environment:
  AIDASH_MARKETPLACE_LISTEN: 0.0.0.0:8082
  AIDASH_MARKETPLACE_ORIGIN: https://marketplace.example.com
  AIDASH_AUTH_ISSUER: https://auth.example.com
  # IPs or CIDR networks of the HTTPS edge (comma-separated). 10.44.0.0/14 is the GKE Pod
  # CIDR from infra/gcp/environments/cluster.tf, where the edge Pods (aidash.run/edge=env)
  # live and change IPs. Every Pod in that range may assert forwarded HTTPS, which is why
  # networkPolicy below admits only the edge Pods to the HTTP port; do not disable it
  # while this network is trusted.
  AIDASH_MARKETPLACE_TRUSTED_PROXY_IPS: 10.44.0.0/14
  AIDASH_MARKETPLACE_CLIENT_SECRET_FILE: /run/secrets/marketplace-client-secret
  AIDASH_MARKETPLACE_RESOURCE_SECRET_FILE: /run/secrets/marketplace-resource-secret
  AIDASH_MARKETPLACE_BILLING_SECRET_FILE: /run/secrets/marketplace-billing-secret
  AIDASH_MARKETPLACE_ENROLLMENT_SECRET_FILE: /run/secrets/marketplace-enrollment-secret
  AIDASH_MARKETPLACE_RECALL_SECRET_FILE: /run/secrets/marketplace-recall-secret
# Browsers and remote Registry Connections (/api/marketplace/*) arrive through the
# edge Pods: with an HTTPS origin the service answers 400 to plain HTTP except
# GET /healthz and the three /internal/ POST routes (billing/events, enrollments,
# recalls). The public edge denies /internal/, so the in-cluster
# Billing, enrollment and Recall integrations call this Service directly over plain
# HTTP with their Bearer secrets; those Pods are the second peer below. The service
# does not know their labels (the standalone services are not yet deployed from
# infra/gcp, Issue #516), so their namespace and labels are PLACEHOLDERS that match
# nothing until replaced. Marketplace calls Authentication (/oauth/token,
# /oauth/introspect, /oauth/revoke) at the AIDASH_AUTH_ISSUER origin, so that is an
# egress concern, not an ingress peer here. The edge Pods live in the namespace of
# this release; if they do not, add a namespaceSelector to the peer. Kubelet probes
# are node-originated and always admitted by GKE Dataplane V2.
networkPolicy:
  enabled: true
  ingress:
    - port: http
      from:
        - podSelector:
            matchLabels:
              aidash.run/edge: env
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_INTEGRATIONS_NAMESPACE
          podSelector:
            matchLabels:
              aidash.run/marketplace-integration: REPLACE_WITH_BILLING_ENROLLMENT_RECALL_WORKLOAD
secretEnvironment:
  AIDASH_MARKETPLACE_DATABASE_URL:
    name: marketplace-runtime
    key: database-url
secretVolumes:
  - name: credentials
    secretName: marketplace-runtime
    mountPath: /run/secrets
