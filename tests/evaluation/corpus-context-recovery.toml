# ------------------------------------------------- long conversation, context
# Corrections arrive as human answers; filler reference pages outgrow the small
# context window. With pruning, only the human answers would carry the
# corrections forward. The evaluator's Agent has no compaction Decider, so the Run
# pauses with `context_unreducible` at the eighth page and is counted unresolved.
[[tasks]]
id = "long-conversation-corrections"
primary_weight = 0.25
semantic_group = "human-corrections"
kind = "long-context"
language = "en-US"
title = "Procurement shortlist with corrections"
prompt = """Prepare a vendor shortlist. Initial constraints: BUDGET-USD=500 and \
EXCLUDE-VENDOR=Northwind. Ask the requester to confirm the constraints before you \
start, then read reference pages 1 to 20 with reference_lookup. Later corrections \
replace earlier values. Call reference_lookup for one page per turn, in page order; never request several pages in one turn. Reply with one JSON object in a ```json block: \
{"budget_usd": number, "excluded_vendors": [names]}."""
model = "small-window"
comparisons = ["projection", "explicit-projection"]
fixture_agent = "constraint-tracker"
context_policy = { version = "context-recovery/1", preserve_recent = 6, overflow_retries = 2, overflow_shrink = 0.75 }
human_answers = [
  "Correction: the budget is now BUDGET-USD=300. Keep EXCLUDE-VENDOR=Northwind and also EXCLUDE-VENDOR=Contoso.",
]
reference_pages = 20
max_steps = 40
reference_page_bytes = 3000
[tasks.oracle]
kind = "constraint-retention"
budget_usd = 300
excluded_vendors = ["Contoso", "Northwind"]
[tasks.expected]
outcome = "unresolved"
context_reason = "context_unreducible"
long_context = "none"

# The same correction arrives only inside an early tool result. Pruning would
# drop it, so a retention failure must be detected rather than graded as
# success. Without a compaction Decider the Run is counted unresolved at the
# eighth page instead (`context_unreducible`).
[[tasks]]
id = "correction-lost-in-pruned-tool-result"
primary_weight = 0.25
semantic_group = "tool-corrections"
kind = "long-context"
language = "en-US"
title = "Procurement shortlist, correction in an archive page"
prompt = """Prepare a vendor shortlist. Initial constraints: BUDGET-USD=500 and \
EXCLUDE-VENDOR=Northwind. Read reference pages 1 to 20 with reference_lookup; an \
archive page may contain corrections, and later corrections replace earlier values. \
Call reference_lookup for one page per turn, in page order; never request several pages in one turn. Reply with one JSON object in a ```json block: {"budget_usd": number, \
"excluded_vendors": [names]}."""
model = "small-window"
comparisons = ["projection", "explicit-projection"]
fixture_agent = "constraint-tracker"
context_policy = { version = "context-recovery/1", preserve_recent = 6, overflow_retries = 2, overflow_shrink = 0.75 }
reference_pages = 20
max_steps = 40
reference_page_bytes = 3000
# Page 2 carries the correction. Page 1 is the oldest call and stays pinned.
reference_corrections = { 2 = "Correction: the budget is now BUDGET-USD=300. Also EXCLUDE-VENDOR=Contoso." }
[tasks.oracle]
kind = "constraint-retention"
budget_usd = 300
excluded_vendors = ["Contoso", "Northwind"]
[tasks.expected]
outcome = "unresolved"
context_reason = "context_unreducible"
long_context = "none"

# Retained content (the human answer) cannot fit the window even after every
# prunable tool result is dropped: with pruning, compaction must fail as a
# terminal overflow. Without a compaction Decider the Run pauses with
# `context_unreducible` and is counted unresolved before any pruning.
[[tasks]]
id = "terminal-context-overflow"
kind = "long-context"
language = "en-US"
title = "Procurement shortlist with an oversized correction"
prompt = """Prepare a vendor shortlist. Initial constraints: BUDGET-USD=500. Ask the \
requester to confirm the constraints before you start, then read reference pages 1 to \
20 with reference_lookup. Call reference_lookup for one page per turn, in page order; never request several pages in one turn. Reply with one JSON object in a ```json block: \
{"budget_usd": number, "excluded_vendors": [names]}."""
model = "small-window"
comparisons = ["projection", "explicit-projection"]
fixture_agent = "constraint-tracker"
context_policy = { version = "context-recovery/1", preserve_recent = 6, overflow_retries = 2, overflow_shrink = 0.75 }
human_answers = ["@oversized:60000"]
reference_pages = 20
max_steps = 40
reference_page_bytes = 3000
[tasks.oracle]
kind = "constraint-retention"
budget_usd = 500
excluded_vendors = []
[tasks.expected]
outcome = "unresolved"
context_reason = "context_unreducible"
long_context = "none"

