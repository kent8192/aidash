# Live context-recovery variant of corpus.toml (#113, #122). See docs/evaluation.md.
#
# Identical to fixed-task-corpus-v2 except for the version and one sentence in the
# prompts of the five long-context tasks: read one reference page per turn. A live
# model otherwise requests every page in one Model Turn, which Native projection
# protects as a whole, so pruning has nothing to remove and the Run pauses with
# `context_unreducible` before any Decider is asked.
#
# v2 also reads 20 pages of 3000 bytes instead of 8-12 pages of 6000 bytes, and lets the
# Summary Stage write up to 4096 tokens. With 6 KB pages the six protected Model Turns
# (preserve_recent >= 6 is enforced) fill almost the whole 62k window, so at most one old
# page is ever a pruning or summary candidate and one conservative Jev answer pauses the Run.
#
# v3 gives these tasks 40 steps: 20 page reads, the confirmation and the reply exceed the
# corpus-wide 24 once compaction rounds are counted, and Runs failed on the step limit.
#
# Fixed-task evaluation corpus (#122). See docs/evaluation.md.
#
# Every task declares an independent oracle. An Agent's own success claim is
# never the oracle. `inputs` and oracle files are paths relative to this
# directory; their bytes are part of the corpus snapshot hash, so changing
# any of them invalidates direct comparisons with earlier results.
#
# `fixture_agent` names the scripted behavior that the deterministic tier's
# fixture model plays for the task (scripts/fixed_task_fixture.py). The live
# tier ignores it. `[tasks.expected]` is the deterministic tier's calibration:
# the evaluator must report exactly this for the scripted behavior, or the run
# fails. It is never applied to live results.
version = "context-recovery-live-v3"
execution_estimator = "bytes"
instructions = """Complete the Task. Use tools only when the Task needs them. \
When you finish, reply with the requested result and no tool calls."""
max_steps = 24

# Fixture model registrations for the deterministic tier. A live experiment
# names its own model instead (see `live` in docs/evaluation.md).
[models.standard]
context_window = 128000
max_output_tokens = 4096

# Sized so the base request plus seven reference pages fits and plus eight does
# not: the eighth page outgrows the window in both arms. The evaluator's Agents
# remove the default compaction binding and carry no Summary Stage, so nothing
# can reduce the context and the Run pauses there with `context_unreducible`.
[models.small-window]
context_window = 62000
max_output_tokens = 1024

# `anthropic/` is the only explicit-cache allowlist prefix (ADR 0019).
[models.explicit-cache]
context_window = 128000
max_output_tokens = 4096
cache_mode = "explicit"

[models.explicit-small-window]
context_window = 62000
max_output_tokens = 1024
cache_mode = "explicit"

# Paired harness configurations. A comparison changes only the Agent
# definition fields below; the task, its inputs, the oracle and the evaluator
# stay identical. `model` overrides the task's fixture model for both arms.
[[comparisons]]
id = "projection"
route = "automatic"
issue = "#116"
description = "Matched automatic-cache route: Legacy, Ordered and Native with prompt_cache off."
arms = [
  { id = "legacy", label = "legacy", agent = { projection_version = "legacy", prompt_cache = "off" } },
  { id = "ordered", label = "ordered", agent = { projection_version = "ordered", prompt_cache = "off" } },
  { id = "native", label = "native", agent = { projection_version = "native", prompt_cache = "off" } },
]

[[comparisons]]
id = "explicit-projection"
route = "explicit"
issue = "#181"
description = "Matched explicit-cache route: three off arms plus Ordered and Native explicit."
model_by_task_model = { standard = "explicit-cache", small-window = "explicit-small-window" }
arms = [
  { id = "legacy", label = "legacy", agent = { projection_version = "legacy", prompt_cache = "off" } },
  { id = "ordered", label = "ordered", agent = { projection_version = "ordered", prompt_cache = "off" } },
  { id = "native", label = "native", agent = { projection_version = "native", prompt_cache = "off" } },
  { id = "ordered-explicit", label = "ordered-explicit", agent = { projection_version = "ordered", prompt_cache = "explicit" } },
  { id = "native-explicit", label = "native-explicit", agent = { projection_version = "native", prompt_cache = "explicit" } },
]

[[comparisons]]
id = "prompt-cache"
issue = "#142"
description = "Ordered requests without and with explicit prompt caching (ADR 0019)."
model = "explicit-cache"
baseline = { label = "ordered", agent = { projection_version = "ordered" } }
candidate = { label = "ordered-explicit-cache", agent = { projection_version = "ordered", prompt_cache = "explicit" } }

[[comparisons]]
id = "exposure"
issue = "#115"
description = "Legacy versus deferred@1 Exposure policy."
baseline = { label = "legacy-exposure", agent = {} }
candidate = { label = "deferred", agent = { exposure = { version = "deferred@1" } } }

# Comparisons without runnable arms. `feature-not-available`: the harness feature
# is not on this branch. `not-measured`: the feature exists but this corpus has no
# comparison for it yet. Both are reported, never as passing and never omitted.
