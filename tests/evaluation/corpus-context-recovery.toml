description = "Pruning and Summary Stage diagnostics are frozen below. Python deterministic execution has no approved fixture Decider route; live diagnostics require exact bounded Decider/Summary allowances. No recovery measurement is claimed until those diagnostics actually execute."

[[comparisons]]
id = "repository-rules"
issue = "#117"
