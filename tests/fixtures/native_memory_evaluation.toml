# Frozen labels for contract evaluation; these do not approve a production model.
version = "native-memory-labels-v1"

[[cases]]
id = "english-preference-negation-failure-date"
language = "en-US"
text = "On 2024-01-04, Aiko said she prefers rail travel. Aiko does not travel by car. The rollback check failed on 2024-01-04; it did not prove the release safe. Heavy rain caused the train delay."
query = "What transportation does Aiko favor, and what happened to the verification?"

[[cases.labels]]
id = "rail-preference"
patterns = [
  "(?i)(Aiko|愛子)",
  "(?i)(rail|train|鉄道|電車)",
  "(?i)(prefer|favor|好き|好む|選好)",
]
kind = "world"
learning = "preference"

[[cases.labels]]
id = "car-negation"
patterns = [
  "(?i)(Aiko|愛子)",
  "(?i)(car|自動車|車)",
  "(?i)(not|never|no |ない|しない|ません)",
]
kind = "world"
learning = "fact"

[[cases.labels]]
id = "failed-check"
patterns = ["(?i)(rollback|ロールバック)", "(?i)(fail|失敗)"]
forbidden = ["(?i)(check succeeded|verification passed|検証に成功|検証は成功)"]
kind = "experience"
learning = "failure"

[[cases.labels]]
id = "weather-cause"
patterns = ["(?i)(rain|雨)", "(?i)(delay|遅延|遅れ)"]
kind = "world"
learning = "fact"

