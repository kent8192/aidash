# Deterministic paired near-duplicate fixture (#139). Both variants use identical
# authority, candidates, relevance scores and vectors; only the policy's
# `diversity_lambda_millionths` differs. The delivery budget fits exactly two
# Units, so three paraphrases of one fact cannot also leave room for the distinct
# fact unless recall diversifies. No model or credential is involved.
[[diversity_cases]]
id = "english-near-duplicate-employer"
language = "en-US"
query = "Where does Aiko work and who is the manager?"
lambda_millionths = 700000
labels = ["employer", "manager"]
expected_useful_recall_without = 0.5
expected_useful_recall_with = 1.0

[[diversity_cases.units]]
id = 1
text = "Aiko works at the Tokyo office."
label = "employer"
score = 1.0
vector = [1.0, 0.02, 0.0]

[[diversity_cases.units]]
id = 2
text = "Aiko is employed at the Tokyo office."
label = "employer"
score = 0.95
vector = [0.99, 0.03, 0.0]

[[diversity_cases.units]]
id = 3
text = "The Tokyo office is where Aiko works."
label = "employer"
score = 0.9
vector = [0.98, 0.04, 0.0]

[[diversity_cases.units]]
id = 4
text = "Aiko's manager is Ren."
label = "manager"
score = 0.8
vector = [0.05, 1.0, 0.0]

