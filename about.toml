# cargo-about policy for the notices of every Cargo workspace.
#
# It matches root/deny.toml's allow list, with BUSL-1.1 because cargo-about
# also runs over the Enterprise workspace. Generate notices with:
#
#   cargo about generate --workspace --locked --manifest-path Cargo.toml \
#     --config about.toml --output-file notices-root.txt about.hbs
#
# `scripts/licensing-inventory.sh` runs it for root, enterprise/ and
# desktop/src-tauri/.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BUSL-1.1",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
