apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: aidash-local-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: aidash-local-postgres }
  template:
    metadata:
      labels: { app: aidash-local-postgres }
    spec:
      containers:
        - name: postgres
          image: aidash-postgres:17-pg-jsonschema-0.3.4
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: aidash }
            - { name: POSTGRES_DB, value: aidash_a }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: aidash-local-infra, key: POSTGRES_PASSWORD }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec:
              command: [pg_isready, -U, aidash, -d, aidash_a]
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: aidash-local-nats }
  ports:
    - { port: 4222, targetPort: 4222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: aidash-local-nats }
  template:
    metadata:
      labels: { app: aidash-local-nats }
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: [-js, -sd, /data]
          ports:
            - { containerPort: 4222 }
          readinessProbe:
            tcpSocket: { port: 4222 }
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: { app: aidash-local-qdrant }
  ports:
    - { port: 6333, targetPort: 6333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: aidash-local-qdrant }
  template:
    metadata:
      labels: { app: aidash-local-qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef: { name: aidash-local-infra, key: QDRANT_API_KEY }
          ports:
            - { containerPort: 6333 }
          readinessProbe:
            tcpSocket: { port: 6333 }
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
