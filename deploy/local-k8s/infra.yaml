apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aidash-memory-recovery
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: aidash-local-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: aidash-local-postgres }
  template:
    metadata:
      labels: { app: aidash-local-postgres }
    spec:
      containers:
        - name: postgres
          image: aidash-postgres:17-pg-jsonschema-0.3.4
          imagePullPolicy: IfNotPresent
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 8Gi }
          command: [sh, -ec]
          args:
            - |
              # Use the same benchmark inputs and 25% memory headroom as the GCP chart.
              shared_mib=256
              active_backend_mib=10
              max_connections=$(( (3 * MEMORY_LIMIT_BYTES - 4 * shared_mib * 1048576) / (4 * active_backend_mib * 1048576) ))
              if [ "$max_connections" -lt 1 ]; then
                echo "PostgreSQL memory limit leaves no connections after shared_buffers and 25% headroom" >&2
                exit 1
              fi
              exec docker-entrypoint.sh postgres -c "shared_buffers=${shared_mib}MB" -c "max_connections=$max_connections"
          env:
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef: { resource: limits.memory, divisor: "1" }
            - { name: POSTGRES_USER, value: aidash }
            - { name: POSTGRES_DB, value: aidash_a }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: aidash-local-infra, key: POSTGRES_PASSWORD }
            - name: AIDASH_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: aidash-local-infra, key: AIDASH_OWNER_PASSWORD }
            - name: AIDASH_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: aidash-local-infra, key: AIDASH_SERVER_PASSWORD }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec:
              command: [pg_isready, -U, aidash, -d, aidash_a]
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: aidash-local-nats }
  ports:
    - { port: 4222, targetPort: 4222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: aidash-local-nats }
  template:
    metadata:
      labels: { app: aidash-local-nats }
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: [-js, -sd, /data]
          ports:
            - { containerPort: 4222 }
          readinessProbe:
            tcpSocket: { port: 4222 }
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
