# Public example credentials for the local development cluster only.
apiVersion: v1
kind: Secret
metadata:
  name: aidash-local-infra
  namespace: aidash-local
type: Opaque
stringData:
  POSTGRES_PASSWORD: aidash-local
  QDRANT_API_KEY: local-semantic-vector-fixture-key-0123456789
---
apiVersion: v1
kind: Secret
metadata:
  name: aidash-local-app
  namespace: aidash-local
type: Opaque
stringData:
  DATABASE_URL: postgres://aidash:aidash-local@postgres:5432/aidash_a
  NATS_URL: nats://nats:4222
  AIDASH_API_TOKEN: local-development-token
  AIDASH_SECRET_TEST_QDRANT: local-semantic-vector-fixture-key-0123456789
