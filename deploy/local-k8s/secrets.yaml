# Public example credentials for the local development cluster only.
apiVersion: v1
kind: Secret
metadata:
  name: aidash-local-infra
  namespace: aidash-local
type: Opaque
stringData:
  POSTGRES_PASSWORD: aidash-local
  AIDASH_OWNER_PASSWORD: aidash-owner-local
  AIDASH_SERVER_PASSWORD: aidash-server-local
---
apiVersion: v1
kind: Secret
metadata:
  name: aidash-local-app
  namespace: aidash-local
type: Opaque
stringData:
  DATABASE_URL: postgres://aidash_server:aidash-server-local@postgres:5432/aidash_a
  NATS_URL: nats://nats:4222
  AIDASH_API_TOKEN: local-development-token
---
# Only the migration Job logs in as the owner of every table.
apiVersion: v1
kind: Secret
metadata:
  name: aidash-local-migration
  namespace: aidash-local
type: Opaque
stringData:
  DATABASE_URL: postgres://aidash_owner:aidash-owner-local@postgres:5432/aidash_a
