# Sign in to the development stack through the generic local OIDC issuer.
services:
  oidc-issuer:
    profiles: [dev, oidc]
  backend:
    environment:
      AIDASH_OIDC_ISSUER: http://127.0.0.1:18099
      AIDASH_OIDC_CLIENT_ID: aidash-local
      AIDASH_OIDC_CLIENT_SECRET: aidash-local-secret
      AIDASH_OIDC_PUBLIC_ORIGIN: "${AIDASH_OIDC_PUBLIC_ORIGIN:?set AIDASH_OIDC_PUBLIC_ORIGIN to the trusted HTTPS dashboard origin}"
  oidc-loopback:
    profiles: [dev, oidc]
    image: node:24.12.0-bookworm-slim
    entrypoint: [node, /oidc-loopback.cjs]
    command: []
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_started
      oidc-issuer:
        condition: service_started
    volumes:
      - ./deploy/local-oidc/loopback.cjs:/oidc-loopback.cjs:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect(18099,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
