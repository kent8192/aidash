{{- $name := printf "%s-aidash" .Release.Name -}}
{{- $backend := printf "%s-backend" .Release.Name -}}
{{- $frontend := printf "%s-frontend" .Release.Name -}}
{{- $nginxConfig := $.Files.Get "files/default.conf" | replace "http://aidash-backend:8080" (printf "http://%s:8080" $backend) -}}
{{- $id := required "node.id must be a stable aidash:// identity" .Values.node.id -}}
{{- if gt (len .Release.Name) 49 -}}
{{- fail "release name must be at most 49 characters" -}}
{{- end -}}
{{- if not (regexMatch "^aidash://[A-Za-z0-9-]{1,100}$" $id) -}}
{{- fail "node.id is not a valid Aidash node identity" -}}
{{- end -}}
{{- if lt (int .Values.terminationGracePeriodSeconds) 25 -}}
{{- fail "terminationGracePeriodSeconds must allow the 20-second application drain" -}}
{{- end -}}
{{- if gt (len .Values.activation.namespace) 128 -}}
{{- fail "activation.namespace must be at most 128 UTF-8 bytes" -}}
{{- end -}}
{{- if and .Values.memoryRecovery.existingClaim (not (hasPrefix "/" .Values.memoryRecovery.directory)) -}}
{{- fail "memoryRecovery.directory must be absolute" -}}
{{- end -}}
{{- range $role := list "server" "worker" }}
{{- $settings := index $.Values $role }}
{{- $secret := required (printf "%s.existingSecret or existingSecret is required" $role) ($settings.existingSecret | default $.Values.existingSecret) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $role }}
  labels:
    app.kubernetes.io/name: aidash
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $settings.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aidash
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: {{ and $.Values.observability.enabled (eq $role "server") }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if $.Values.memoryRecovery.existingClaim }}
        fsGroup: 10001
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aidash
          image: {{ printf "%s:%s" $.Values.image.repository $.Values.image.tag | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $role | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          envFrom:
            - secretRef: { name: {{ $secret | quote }} }
          env:
            - { name: AIDASH_NODE_ID, value: {{ $id | quote }} }
            {{- if $.Values.memoryRecovery.existingClaim }}
            - { name: AIDASH_MEMORY_RECOVERY_DIR, value: {{ $.Values.memoryRecovery.directory | quote }} }
            {{- end }}
            - { name: AIDASH_ACTIVATION_BOOTSTRAP, value: "false" }
            - { name: AIDASH_ACTIVATION_NAMESPACE, value: {{ $.Values.activation.namespace | quote }} }
            - { name: AIDASH_ACTIVATION_MAX_AGE_SECONDS, value: {{ $.Values.activation.maxAgeSeconds | int64 | toString | quote }} }
            - { name: AIDASH_ACTIVATION_MAX_BYTES, value: {{ $.Values.activation.maxBytes | int64 | toString | quote }} }
            - { name: AIDASH_ACTIVATION_REPLICAS, value: {{ $.Values.activation.replicas | int64 | toString | quote }} }
            - { name: AIDASH_WORKER_SLOTS, value: {{ $.Values.worker.slots | int64 | toString | quote }} }
            {{- if eq $role "server" }}
            - { name: AIDASH_SSE_RECONCILE_INTERVAL_MS, value: {{ $.Values.sse.reconcileIntervalMs | int64 | toString | quote }} }
            - { name: AIDASH_SSE_BACKPRESSURE_TIMEOUT_SECONDS, value: {{ $.Values.sse.backpressureTimeoutSeconds | int64 | toString | quote }} }
            {{- end }}
            - name: AIDASH_ENDPOINT
              value: {{ $.Values.node.endpoint | default (printf "http://%s.%s.svc:8080" $backend $.Release.Namespace) | quote }}
            - { name: AIDASH_LISTEN, value: "0.0.0.0:8080" }
            - { name: AIDASH_PROBE_LISTEN, value: "0.0.0.0:8081" }
            {{- if and $.Values.observability.enabled (eq $role "server") }}
            - name: AIDASH_KUBERNETES_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: AIDASH_KUBERNETES_RELEASE, value: {{ $.Release.Name | quote }} }
            {{- end }}
          ports:
            - { name: probes, containerPort: 8081 }
            {{- if eq $role "server" }}
            - { name: http, containerPort: 8080 }
            {{- end }}
          startupProbe:
            httpGet: { path: /live, port: probes }
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: { path: /ready, port: probes }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /live, port: probes }
            periodSeconds: 10
            timeoutSeconds: 2
          resources: {{ toYaml $settings.resources | nindent 12 }}
          {{- if $.Values.memoryRecovery.existingClaim }}
          volumeMounts:
            - name: memory-recovery
              mountPath: {{ $.Values.memoryRecovery.directory | quote }}
              {{- with $.Values.memoryRecovery.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
          {{- end }}
      {{- if $.Values.memoryRecovery.existingClaim }}
      volumes:
        - name: memory-recovery
          persistentVolumeClaim: { claimName: {{ $.Values.memoryRecovery.existingClaim | quote }} }
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $backend }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $frontend }}-conf
data:
  default.conf: |-
{{ $nginxConfig | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $frontend }}
  labels:
    app.kubernetes.io/name: aidash
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ $nginxConfig | sha256sum }}
      labels:
        app.kubernetes.io/name: aidash
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.frontend.image.repository .Values.frontend.image.tag | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-config
          configMap: { name: {{ $frontend }}-conf }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
{{- if .Values.observability.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-observe
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-observe
subjects:
  - { kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-observe
{{- end }}
