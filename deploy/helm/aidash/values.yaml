image:
  repository: aidash
  tag: "0.1.0"
  # sha256:<hex>; when set, server and worker run repository@digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
node:
  id: ""
  # Stable federation URL; defaults to the internal backend Service.
  endpoint: ""
release:
  # Deployed commit; annotates the server/worker Deployments as aidash.run/source-sha.
  sourceSha: ""
# Provision separately: DATABASE_URL, NATS_URL, AIDASH_API_TOKEN and provider/
# pair-specific AIDASH_SECRET_* variables. DATABASE_URL names the aidash_server
# login; servers and workers refuse a superuser, BYPASSRLS or owning login and
# start only on a migrated database, so run `aidash migrate` as aidash_owner
# before every install or upgrade (docs/orchestration.md). For a postgres Secret Store,
# include AIDASH_PROVIDER_STORE_MASTER_KEY and AIDASH_PROVIDER_FINGERPRINT_KEY.
# existingSecret reaches both server and worker through envFrom; role overrides
# must each carry the keys. No secret values belong in Helm values.
existingSecret: ""
# Native memory requires an independently retained, pre-initialized Home ledger.
# Server and workers share this claim; do not restore it from a PostgreSQL backup.
memoryRecovery:
  existingClaim: ""
  directory: /var/lib/aidash/memory-recovery
  # Select the initialized Home directory when it is a child of the claim root.
  subPath: ""
capabilities:
  storage:
    # Retained RWO claim for capability objects, mounted at /var/lib/aidash/capabilities
    # in server and worker; objects live in its objects/ child. Required with the Runner.
    existingClaim: ""
# Socket peers (IPs or CIDRs) allowed to supply X-Real-IP, e.g. the edge Pod CIDR.
trustedProxy:
  cidrs: []
# Private origins (scheme://host[:port]) that Tenants' Keyless model and
# embedding endpoints may reach; every other Keyless endpoint connects only to
# public addresses. Omit default ports: http://ollama.lan, not http://ollama.lan:80.
keylessEndpoints:
  permittedPrivateOrigins: []
# When set, a NetworkPolicy admits backend :8080 only from these same-namespace
# Pod label sets (plus this release's frontend when enabled).
backendIngress:
  podSelectors: []
# Denies 169.254.169.254 (the GKE metadata server) to every Pod of the namespace
# except server and worker, which need their Workload Identity tokens. Defense in
# depth: GKE_METADATA already hides node credentials from Pods. Disable only where
# no metadata server exists to protect and the CNI rejects egress policies.
metadataServerEgress:
  enabled: true
# Managed Provider Credential descriptor {fingerprint_key, store, broker}; null
# renders nothing. Rendered as {"provider_credentials": ...} for
# AIDASH_PROVIDER_CREDENTIAL_SETTINGS. Never key material.
providerCredentials:
  settings: null
# Managed public GCIP fragment {dashboard: {gcip: {...}}} for AIDASH_GCIP_SETTINGS;
# public_origin must equal node.endpoint. null renders nothing.
gcip:
  settings: null
# Deployment, or StatefulSet for the server, worker and Runner, which hold
# ReadWriteOnce claims. GKE's Stateful HA fails StatefulSets on regional disks
# over to another zone (ADR 0067).
workloadKind: Deployment
highAvailability:
  # Render a HighAvailabilityApplication for each StatefulSet; needs the GKE
  # Stateful HA add-on, regional disks and workloadKind StatefulSet.
  enabled: false
  # How long after its Cluster Node is unreachable a Pod is force-deleted.
  afterNodeUnreachableSeconds: 20
server:
  serviceAccount:
    annotations: {}
  # Optional role-scoped override of existingSecret.
  existingSecret: ""
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "2", memory: 1Gi }
sse:
  reconcileIntervalMs: 5000
  backpressureTimeoutSeconds: 30
worker:
  serviceAccount:
    annotations: {}
  existingSecret: ""
  slots: 4
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "2", memory: 1Gi }
frontend:
  # Disable when the application image serves the web bundle itself.
  enabled: true
  replicas: 1
  image:
    repository: aidash-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
service:
  type: ClusterIP
  port: 8080
  # Set only when service.type is NodePort (for example, local kind access).
  nodePort: null
observability:
  enabled: true
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}

# Per-Environment scheduling (e.g. cloud.google.com/gke-nodepool: develop).
environment:
  nodeSelector: {}
  tolerations:
    - {
        key: node.kubernetes.io/not-ready,
        operator: Exists,
        effect: NoExecute,
        tolerationSeconds: 30,
      }
    - {
        key: node.kubernetes.io/unreachable,
        operator: Exists,
        effect: NoExecute,
        tolerationSeconds: 30,
      }

# Only GKE Standard Ubuntu/containerd N2 pools have been verified on GCP.
# Each component is opt-in. Names are unique per Environment/release.
execution:
  sandboxNamespace: ""
  trustedNamespace: ""
  # Empty derives <release>-installer. The privileged installer never shares a
  # namespace with the guard, whose Pods the Runner may exec into.
  installerNamespace: ""
  createNamespaces: false
  podSecurityVersion: v1.34
  imagePullPolicy: IfNotPresent
  sandboxImage: ""
  runtimeClass:
    create: false
    name: ""
  gvisor:
    version: "20260921.0"
    sha256: "3dd478770dd751d09c257ba14d739b179348a36c5f2d9e954b773f5f90bff646"
    # Admission: set to the verified version; the RuntimeClass requires it, and the
    # installer withdraws it while replacing a runtime so no new sandbox starts.
    label: aidash.run/gvisor
    # Placement of the node-local guard. Set once a runtime is verified and kept
    # during replacement, so live sandboxes always have a watchdog.
    installedLabel: aidash.run/gvisor-installed
  paths:
    runscRoot: /run/containerd/runsc
    runsc: /usr/local/bin/runsc
    gvisorBin: /usr/local/bin/gvisor-bin
    ctr: /usr/bin/ctr
    cgroupRoot: /sys/fs/cgroup
    # Empty derives /var/lib/aidash-node-guard/<release>: each guard holds an
    # exclusive watch.lock, so releases sharing a Node need distinct directories.
    guardState: ""
    sentryBinaries:
      [/usr/local/bin/runsc, /usr/local/bin/gvisor-bin/gvisor_sentry]
  installer:
    enabled: false
    # Build from the trusted ref, never the deployed PR source.
    image: aidash-runner:0.1.0
  guard:
    enabled: false
    # Build from the trusted ref, never the deployed PR source.
    image: aidash-runner:0.1.0
  runner:
    enabled: false
    # Build from the trusted ref, never the deployed PR source.
    image: aidash-runner:0.1.0
    existingSecret: ""
    tokenKey: AIDASH_CORE_RUNNER_TOKEN
    # A NetworkPolicy admits Runner :8949 only from this release's server,
    # worker and migration Pods plus these same-namespace Pod label sets.
    ingress:
      podSelectors: []
    journal:
      existingClaim: ""
      storageClassName: ""
      size: 10Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  egress:
    enabled: false
    # Reserve an unused Service IP in the cluster's Service CIDR before enabling.
    clusterIP: ""
    port: 8950
    limits:
      { sent_bytes: 1073741824, received_bytes: 1073741824, requests: 1000 }
  limits:
    cpu: 2
    memory_bytes: 2147483648
    processes: 128
    host_tasks: 512
    working_bytes: 1073741824
    temporary_bytes: 268435456
    output_bytes: 8388608
    maximum_seconds: 600
    idle_seconds: 1800

# Stable across Pod replacements. Provision once with `aidash activation-provision`
# using NATS operator credentials and these same values; runtime does not create objects.
activation:
  namespace: default
  maxAgeSeconds: 86400
  maxBytes: 1073741824
  replicas: 1
