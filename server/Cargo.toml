[package]
name = "aidash-server"
version = "0.1.0"
edition.workspace = true
default-run = "aidash"
rust-version = "1.96"
publish = false
autotests = false

[lib]
name = "aidash_server"

[lints]
workspace = true

[[bin]]
name = "aidash"
path = "src/bin/aidash.rs"

[[bin]]
name = "manage"
path = "src/bin/manage.rs"

[[bin]]
name = "local-dev-db"
path = "src/bin/local-dev-db.rs"

[dependencies]
aidash-domain.workspace = true
aidash-application.workspace = true
aidash-runtime.workspace = true
aidash-integrations.workspace = true
reinhardt = { workspace = true, features = [
  "api-only",
  "database",
  "db-postgres",
  "auth",
  "sessions",
  "static-files",
  "openapi",
  "openapi-swagger-ui",
  "browsable-api",
  "websockets",
  "cache",
  "mail",
  "tasks",
  "conf",
  "commands",
  "client-router",
  "api",
  "commands-contract",
] }
# Enable UUID path extraction until the facade forwards reinhardt-di/uuid.
# Remove this direct dependency after reinhardt-web#6495 is fixed and verified.
reinhardt-di = { git = "https://github.com/kent8192/reinhardt-web", rev = "ab21faf668cec073798fa2c3a09f6d6bf70687d8", default-features = false, features = [
  "uuid",
] }
clap = { version = "4", features = ["derive"] }
http = "1"
mime_guess = "2"
bytes = "1"
ctor = "0.6"
linkme = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
# Supply serde-complete schema definitions to Reinhardt OpenAPI.
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

async-trait = "0.1.89"
async-nats = "0.46"
async-stream = "0.3"
base64 = "0.22"
futures-util = "0.3"
jsonschema = { version = "0.33", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
] }
openidconnect = "4.0.1"
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }
semver = "1"
sha2 = "0.10"
serde-saphyr = "=1.3.0"
hmac = "0.12"
percent-encoding = "2"
indexmap = "2"
regex = "1.12"
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
time = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "migrate",
  "macros",
  "json",
  "uuid",
  "chrono",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cfg_aliases = "0.2"

[dev-dependencies]
axum-test = "18.7"
axum = { version = "0.8", features = ["json", "query", "macros"] }
reinhardt = { workspace = true, features = [
  "test",
  "testcontainers",
] }
rstest = "0.26.1"
tempfile = "3"
toml = "1.1"
tokio = { version = "1", features = ["test-util"] }

[features]
default = []
commands-shell = ["reinhardt/commands-shell"]
capability-runtime-tests = []

# Keep every test target with its owning application. Shared fixture modules are
# not independent test binaries. Cargo still provides CARGO_BIN_EXE_manage.

[[test]]
name = "agent_workbenches"
path = "src/apps/registry/workbench/tests/agent_workbenches.rs"

