[package]
name = "aidash-desktop"
version = "0.1.0"
edition = "2024"
publish = false

# Keep desktop system libraries out of backend/worker builds.
[workspace]

[features]
# Explicit opt-in; never included in normal development or distribution builds.
e2e = [
  "dep:tauri-plugin-wdio-webdriver",
  "dep:tauri-plugin-wdio",
  "tokio/process",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "sync",
  "net",
  "io-util",
  "time",
  "macros",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Windows uses external tauri-driver until the embedded driver's WebView2
# bindings match Tauri; see the compatibility note in desktop/README.md.
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = [
  "sync-secret-service",
  "crypto-rust",
] }

[dev-dependencies]
rstest = "0.26"
