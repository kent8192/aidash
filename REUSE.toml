# REUSE annotations for Aidash (REUSE specification 3.x, version 1).
#
# A license follows the material, not its filename or location. Community is
# Apache-2.0. Enterprise is BUSL-1.1 under enterprise/LICENSE. Third-party
# material keeps its own terms and overrides these path annotations.
#
# The Enterprise annotation keeps precedence "closest" so a later BUSL-1.1
# header inside an Enterprise source file wins over this table.

version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 kent8192"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "enterprise/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 kent8192"
SPDX-License-Identifier = "BUSL-1.1"

# Third-party material. "override" keeps the terms recorded in
# THIRD_PARTY_NOTICES.md authoritative over any header inside the file.

[[annotations]]
path = "third_party/fast-jev-compaction/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2025 the fast-jev-compaction authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/hindsight/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/gpt-oss/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "OpenAI"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "third_party/gemma-4/LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "enterprise/auth/static/assets/fonts/mono/**",
  "enterprise/marketplace/static/assets/fonts/mono/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "enterprise/auth/static/assets/fonts/sans/**",
  "enterprise/marketplace/static/assets/fonts/sans/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2019 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "enterprise/auth/static/assets/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2025 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# The vendor directory's README and provenance record are Aidash material that
# describes the Firebase files; they are not Firebase code.
[[annotations]]
path = [
  "enterprise/auth/static/assets/vendor/README.md",
  "enterprise/auth/static/assets/vendor/provenance.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 kent8192"
SPDX-License-Identifier = "BUSL-1.1"

[[annotations]]
path = "crates/aidash-application/src/decision/state.rs"
precedence = "override"
SPDX-FileCopyrightText = "2025 the fast-jev-compaction authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "crates/aidash-domain/src/memory.rs",
  "crates/aidash-domain/src/memory/recall.rs",
  "crates/aidash-domain/src/memory/graph.rs",
  "crates/aidash-domain/src/memory/extraction.rs",
  "crates/aidash-domain/src/memory/consolidation.rs",
  "crates/aidash-application/src/memory.rs",
  "server/src/apps/knowledge/repositories/engine_jobs.rs",
  "server/src/apps/knowledge/repositories/engine_jobs/consolidation.rs",
  "server/src/apps/knowledge/repositories/learning.rs",
  "server/src/apps/knowledge/services/memory_models.rs",
  "server/src/apps/knowledge/repositories/native_memory.rs",
  "server/src/apps/knowledge/repositories/postgres_vector.rs",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "crates/aidash-domain/assets/token-encodings/o200k_base.json.zst"
precedence = "override"
SPDX-FileCopyrightText = "OpenAI"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "crates/aidash-domain/assets/token-encodings/gemma4.json.zst"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"
