[workspace]

[package]
name = "aidash-infra-observer"
version = "0.1.0"
edition = "2024"
publish = false

# Keep both revisions equal to the root workspace's reinhardt pin; a test
# compares them.
[dependencies]
reinhardt-db = { git = "https://github.com/kent8192/reinhardt-web", rev = "14dc81dec2a2cc10641a8f15c455bbaafc2c774e", default-features = false, features = [
  "backends",
  "postgres",
] }
reinhardt-query = { git = "https://github.com/kent8192/reinhardt-web", rev = "14dc81dec2a2cc10641a8f15c455bbaafc2c774e" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
] }
