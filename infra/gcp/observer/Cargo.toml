[workspace]

[package]
name = "aidash-infra-observer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sea-orm = { version = "1.1.19", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "with-json",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
