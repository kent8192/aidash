lua_shared_dict aidash_activity 1m;
init_by_lua_block {
  -- The controller-owned desired state survives edge restarts. A missing,
  -- unreadable or unexpected state keeps admission closed.
  local open = false
  local file = io.open("/etc/aidash-admission/state", "r")
  if file then
    local state = file:read("*a") or ""
    file:close()
    open = state:match("^%s*(.-)%s*$") == "open"
  end
  ngx.shared.aidash_activity:set("closed", not open)
  -- The in-memory dictionary dies with the container, so the last meaningful
  -- request is also kept on the Pod's emptyDir (see log_by_lua_block). Restoring
  -- it keeps a restart between a request and the collector's next sample from
  -- reporting last_active = 0 and shortening the idle interval. Missing or
  -- unreadable means never active; a future stamp (clock step) is clamped to now.
  local stamp = io.open("/var/lib/aidash-activity/last_active", "r")
  if stamp then
    local restored = tonumber(stamp:read("*a"))
    stamp:close()
    if restored and restored > 0 then
      ngx.shared.aidash_activity:set("last_active", math.min(restored, ngx.now()))
    end
  end
}
server {
  listen 0.0.0.0:8089;
  access_log off;
  location ~ ^/admission/(close|open)$ {
    # Only the trusted controller, via `kubectl exec ... curl` on this Pod's
    # loopback, may toggle admission. Pod-network peers allowed to read
    # /activity (the collector Pod, including its database-facing observer)
    # must not be able to reopen the edge during a lifecycle seal.
    allow 127.0.0.1;
    deny all;
    content_by_lua_block {
      if ngx.req.get_method() ~= "POST" then return ngx.exit(405) end
      ngx.shared.aidash_activity:set("closed", ngx.var.uri == "/admission/close")
      ngx.say('{}')
    }
  }
  location = /activity {
    content_by_lua_block {
      local state = ngx.shared.aidash_activity
      ngx.header.content_type = "application/json"
      ngx.say(require("cjson").encode({
        inflight = state:get("inflight") or 0,
        last_active = state:get("last_active") or 0,
        closed = state:get("closed") or false
      }))
    }
  }
}
server {
  listen 127.0.0.1:8088;
  # Caddy replaces incoming X-Forwarded-For with the socket client address.
  # Only that local proxy may supply it; never forward a caller's X-Real-IP.
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  # Activity is read from the shared dictionary; a file log here would only
  # grow the container's writable layer without rotation.
  access_log off;
  client_max_body_size 110m;
  location / {
    access_by_lua_block {
      local method, uri = ngx.req.get_method(), ngx.var.uri
      local write = method == "POST" or method == "PUT" or method == "PATCH" or method == "DELETE"
      local federation = write and uri:sub(1,17) == "/federation/v0.1/"
      -- Sign-in steps and the dashboard's interaction heartbeat are user intent;
      -- session/config polling, token refresh and logout are not.
      local auth = (method == "GET" and ngx.re.find(uri, "^/auth/(login|callback|gcip/transaction|desktop/authorize)$"))
        or (method == "POST" and ngx.re.find(uri, "^/auth/(activity|registration|gcip/exchange|desktop/(start|authorize|exchange))$"))
      local intent = auth or (write and uri:sub(1,5) == "/api/") or federation
      if ngx.re.find(uri, "^/api/runs/[^/]+/(shell|python)/poll$")
        or ngx.re.find(uri, "^/api/(peer/|metrics|state|session)") then intent = false end
      -- Peer reads use POST too. Count their in-flight body without renewing idle.
      if ngx.re.find(uri, "^/federation/v0[.]1/(discover|workspace|scoped/discover|scoped/registry/verify|scoped/execution/(inspect|status|grants/(verify|snapshot|describe|activation)|admissions/[^/]+/verify)|scoped/files/(negotiate|describe|status|recipients))$") then intent = false end
      if intent or federation then
        ngx.shared.aidash_activity:incr("inflight", 1, 0)
        ngx.ctx.aidash_inflight = true
        ngx.ctx.aidash_intent = intent
      end
      -- Count first, then check admission. Once close is acknowledged, an
      -- earlier admitted write is counted and a later write cannot reach upstream.
      if ngx.shared.aidash_activity:get("closed") then return ngx.exit(503) end
    }
    log_by_lua_block {
      if ngx.ctx.aidash_inflight then
        ngx.shared.aidash_activity:incr("inflight", -1, 0)
        if ngx.ctx.aidash_intent and ngx.status >= 200 and ngx.status < 400 then
          local now = ngx.now()
          ngx.shared.aidash_activity:set("last_active", now)
          -- Replace atomically from a per-worker file: a restart reads either the
          -- previous or the new stamp, never a partial one.
          local path = "/var/lib/aidash-activity/last_active"
          local temporary = path .. "." .. ngx.worker.pid()
          local stamp = io.open(temporary, "w")
          if stamp and stamp:write(string.format("%.3f", now)) and stamp:close() and os.rename(temporary, path) then
            return
          end
          ngx.log(ngx.ERR, "cannot persist the edge activity timestamp")
        end
      end
    }
    proxy_pass http://AIDASH_BACKEND:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
