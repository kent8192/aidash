[package]
name = "aidash-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
secrecy = "0.10"
aidash-application.workspace = true
aidash-domain.workspace = true
aidash-capability = { path = "../aidash-capability" }
zeroize = "1"
crc32c = "0.6"
async-trait.workspace = true
metrics = "0.24"
tracing = "0.1"
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
uuid.workspace = true

reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls",
] }

async-nats = "0.46"
futures-util.workspace = true
percent-encoding = "2"

rmcp = { version = "=1.2.0", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
async-stream = "0.3"
sse-stream = "0.2.6"

base64 = "0.22"

sha2 = "0.10"

jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
] }
openidconnect = "4.0.1"

[dev-dependencies]
rstest.workspace = true
axum = "0.8"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
