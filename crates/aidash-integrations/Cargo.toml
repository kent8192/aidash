[package]
name = "aidash-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reinhardt = { workspace = true, features = ["grpc-tls"], optional = true }
prost = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
secrecy = "0.10"
aidash-application.workspace = true
aidash-capability.workspace = true
aidash-domain.workspace = true
async-trait.workspace = true
metrics = "0.24"
tracing = "0.1"
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
uuid.workspace = true

reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "rustls",
  "stream",
] }
encoding_rs = "0.8"
# Pure-Rust PDF reading and rendering for Page reading (#312). It runs only in
# a bounded child process, because it caps neither decompression nor time.
hayro = { version = "0.8", optional = true }
aidash-runtime = { workspace = true, optional = true }

async-nats = { version = "0.46", optional = true }
futures-util.workspace = true
percent-encoding = "2"
url = "2"

rmcp = { version = "=1.2.0", optional = true, default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
async-stream = "0.3"
sse-stream = "0.2.6"

base64 = "0.22"

sha2 = "0.10"
hmac = "0.12"

# The Deployment Key file: PKCS#8 PEM, Ed25519 (ADR 0064).
ed25519-dalek = { version = "2.2", features = [
  "pkcs8",
  "pem",
  "zeroize",
  "rand_core",
] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
] }
openidconnect = "4.0.1"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[features]
default = ["cloud-adapters"]
# Standalone consumers select authentication/JWKS without worker, NATS or runtime adapters.
cloud-adapters = [
  "dep:aidash-runtime",
  "dep:async-nats",
  "dep:hayro",
  "dep:rmcp",
]
authentication = ["dep:reinhardt", "dep:prost", "dep:tonic-prost"]
# Fake-provider constructors for tests (ADR 0006). Production dependencies never
# enable it; see scripts/check-workspace-boundaries.py.
test-support = []

[dev-dependencies]
rcgen = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# The live Token Encoding checks count requests (ADR 0017).
aidash-domain = { workspace = true, features = ["token-encodings"] }
jsonwebtoken = { version = "11.1", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] }
rstest.workspace = true
axum = "0.8"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
flate2 = "1"
