[workspace]
members = ["crates/*", "server"]
default-members = ["server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
aidash-domain = { path = "crates/aidash-domain" }
aidash-application = { path = "crates/aidash-application" }
aidash-harness = { path = "crates/aidash-harness" }
aidash-runtime = { path = "crates/aidash-runtime" }
aidash-integrations = { path = "crates/aidash-integrations" }
reinhardt = { git = "https://github.com/kent8192/reinhardt-web", rev = "19928e83b46c130a3a40320e5c9b71aa9f84e322", package = "reinhardt-web", default-features = false }
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rstest = "0.26.1"

[workspace.lints.clippy]
# Domain names remain explicit when types are imported independently.
module_name_repetitions = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
