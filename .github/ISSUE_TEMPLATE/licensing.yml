name: "\U0001F4DC Licensing Inquiry"
description: Ask about Aidash licensing, Enterprise use or commercial terms
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        Use this form for licensing questions about Aidash.

        **Do not post personal details.** This issue is public. Do not include
        your home address, phone number, private e-mail address, credentials,
        contract text or other sensitive information.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have read LICENSE, docs/licensing.md and COMMERCIAL-LICENSING.md
          required: true
        - label: I have searched existing issues for the same question
          required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Community use under Apache-2.0
        - Enterprise evaluation or non-production use
        - Enterprise production use through Cloud or Dedicated
        - Redistribution or integration
        - Contribution terms
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you need to know. Do not include personal details.
      placeholder: |
        I want to...
        The license says...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: The components and versions involved. Keep it free of personal details.
      placeholder: |
        Component: Community or Enterprise
        Version: 0.1.0
        Use: ...

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I understand this issue is public and have not included personal details or sensitive information
          required: true
