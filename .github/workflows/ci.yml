name: CI
on:
  pull_request:
  push:
    branches: [main, "develop/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
jobs:
  gcp-infrastructure:
    name: GCP infrastructure
    uses: ./.github/workflows/gcp-check.yml
  lint:
    name: Trunk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: rustup show active-toolchain
      - uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
      - name: Check formatting and lint
        run: '"$TRUNK_PATH" check --all --no-fix --no-progress --print-failures --exclude clippy'
  rust-lint:
    name: Rust Clippy (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: backend
            directory: .
            features: --all-features
          - workspace: desktop
            directory: desktop/src-tauri
            features: ""
          - workspace: observer
            directory: infra/gcp/observer
            features: ""
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-clippy
          key: ${{ matrix.workspace }}
          workspaces: "${{ matrix.directory }} -> target"
      - name: Install existing desktop system dependencies
        if: matrix.workspace == 'desktop'
        run: |
          scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Check each Cargo workspace once with warnings denied
        run: cargo clippy --locked --manifest-path '${{ matrix.directory }}/Cargo.toml' --workspace --all-targets ${{ matrix.features }} -- -D warnings
  collaboration-ui:
    name: Collaboration browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: scripts/install-browser.sh
      - run: npm run test:graph --prefix web && npm run test:collaboration --prefix web
      - run: npm run test:ui --prefix web -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - name: Validate required capability browser journeys
        run: python3 scripts/core-capability-evidence.py browser web/test-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: collaboration-browser-evidence
          path: web/test-results/
          if-no-files-found: ignore
  rust-tests:
    name: Rust tests (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition:
          [
            foundation,
            server-unit,
            identity,
            execution,
            persistence,
            collaboration,
            federation,
            knowledge-marketplace,
          ]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      AIDASH_COVERAGE_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-coverage
          key: ${{ matrix.partition }}
          workspaces: ". -> target/llvm-cov"
      - name: Install coverage tool
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Verify workspace boundaries and complete test partition inventory
        run: |
          cargo metadata --locked --format-version 1 | python3 scripts/check-workspace-boundaries.py
          python3 scripts/rust-test-partitions.py --check
      - name: Test portable workspace dependency rules
        if: matrix.partition == 'foundation'
        run: python3 scripts/test_workspace_boundaries.py
      - name: Verify cross-crate coverage collection
        if: matrix.partition == 'foundation'
        run: python3 scripts/test_rust_test_partitions.py
      - name: Test the selected partition with disposable services and collect LCOV
        run: scripts/test-rust.sh --coverage --partition '${{ matrix.partition }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ matrix.partition }}
          path: coverage/rust-${{ matrix.partition }}.lcov
          if-no-files-found: error
  rust-coverage:
    name: Rust coverage upload
    needs: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rust-coverage-*
          merge-multiple: true
          path: coverage/parts
      - name: Require every partition's coverage before upload
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import runpy
          partitions = runpy.run_path("scripts/rust-test-partitions.py")["PARTITIONS"]
          directory = Path("coverage/parts")
          expected = {f"rust-{partition}.lcov" for partition in partitions}
          actual = {path.name for path in directory.glob("*.lcov") if path.stat().st_size}
          assert actual == expected, (expected - actual, actual - expected)
          PY_CHECK
      - name: Upload all Rust partitions to Codecov together
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          use_oidc: true
          # See docs/operations/ci-coverage.md for the CLI download outage and removal condition.
          use_pypi: true
          version: v11.3.1
          files: coverage/parts/rust-foundation.lcov,coverage/parts/rust-server-unit.lcov,coverage/parts/rust-identity.lcov,coverage/parts/rust-execution.lcov,coverage/parts/rust-persistence.lcov,coverage/parts/rust-collaboration.lcov,coverage/parts/rust-federation.lcov,coverage/parts/rust-knowledge-marketplace.lcov
          flags: rust
          disable_search: true
          fail_ci_if_error: true
  infrastructure-tests:
    name: Infrastructure contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_transaction_cluster_acceptance.py
      - run: python3 -m unittest discover -s scripts -p test_core_capability_evidence.py
      - run: python3 -m unittest discover -s scripts -p test_golden_path.py
      - run: python3 -m unittest discover -s runner -p test_resource_limits.py
  acceptance:
    name: Federation and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup show active-toolchain
      - name: Test scoped and legacy federation, Worker crashes and Chromium dashboard
        run: scripts/test-acceptance.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-evidence
          include-hidden-files: true
          path: |
            .ignore/acceptance/
            .ignore/dashboard-*.png
            web/test-results/
      - name: Stop verification services
        if: always()
        run: docker compose down
  bruno:
    name: Bruno API contracts (271 endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: production-http
      - name: Validate every route, scenario and sanitized evidence requirement
        run: |
          python3 scripts/bruno_contracts.py --check
          python3 scripts/test_bruno_contracts.py
      - name: Start real PostgreSQL and JetStream fixtures
        run: docker compose up --build -d --wait postgres nats
      - name: Run all 941 HTTP scenarios through the native management server
        run: npm exec --yes --package=@usebruno/cli@3.1.3 -- scripts/test-bruno-api.sh
        env:
          AIDASH_BRUNO_POSTGRES_PASSWORD: aidash-local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bruno-api-evidence
          include-hidden-files: true
          path: .ignore/bruno/
          if-no-files-found: error
      - name: Stop owned verification services
        if: always()
        run: docker compose down -v
  orchestration:
    name: Cluster recovery (${{ matrix.distribution }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distribution: [kubernetes, k3s]
        profile: [platform, remote-memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --prefix web
      - run: scripts/install-browser.sh
      - name: Test Pod recovery, scaling, rolling updates and dashboard
        run: bash scripts/test-cluster.sh '${{ matrix.distribution }}' '${{ matrix.profile }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cluster-evidence-${{ matrix.distribution }}-${{ matrix.profile }}
          include-hidden-files: true
          path: |
            .ignore/platform/aidash-ops-*/
            .ignore/transaction-acceptance/*/
            .ignore/dashboard-deployment-cluster-*.png
  transaction-cluster:
    name: Transaction recovery (${{ matrix.distribution }}, ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distribution: [kubernetes, k3s]
        partition: [coordinator, participant, lifecycle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Test every selected durable cut and lifecycle repetition
        run: bash scripts/test-cluster.sh '${{ matrix.distribution }}' transactions '${{ matrix.partition }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transaction-evidence-${{ matrix.distribution }}-${{ matrix.partition }}
          include-hidden-files: true
          path: .ignore/transaction-acceptance/*/
          if-no-files-found: error
  core-runtime:
    name: Core capability isolation and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: core-runtime
      - name: Verify gVisor, real execution and two-node transfer faults
        run: scripts/test-capability-cluster.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: core-runtime-evidence
          include-hidden-files: true
          path: .ignore/core-runtime/*/evidence/
          if-no-files-found: error
  success:
    name: CI Success
    needs:
      [
        gcp-infrastructure,
        lint,
        rust-lint,
        collaboration-ui,
        rust-tests,
        rust-coverage,
        infrastructure-tests,
        bruno,
        acceptance,
        orchestration,
        transaction-cluster,
        core-runtime,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("All required CI jobs passed.")
          PY
