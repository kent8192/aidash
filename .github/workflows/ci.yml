name: CI
on:
  pull_request:
  push:
    branches: [main, "develop/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
jobs:
  gcp-infrastructure:
    name: GCP infrastructure
    uses: ./.github/workflows/gcp-check.yml
  lint:
    name: Trunk
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: rustup show active-toolchain
      - uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
      - name: Check formatting and lint
        run: '"$TRUNK_PATH" check --all --no-fix --no-progress --print-failures --exclude clippy'
      - name: Check Deployment Administrator terminology
        run: |
          python3 scripts/test_check_role_terminology.py
          python3 scripts/check-role-terminology.py
  rust-lint:
    name: Rust Clippy (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: backend
            directory: .
            features: --all-features
          - workspace: desktop
            directory: desktop/src-tauri
            features: ""
          - workspace: observer
            directory: infra/gcp/observer
            features: ""
          - workspace: enterprise
            directory: enterprise
            features: ""
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-clippy
          key: ${{ matrix.workspace }}
          workspaces: "${{ matrix.directory }} -> target"
      - name: Install existing desktop system dependencies
        if: matrix.workspace == 'desktop'
        run: |
          scripts/configure-ci-apt.sh
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - name: Check each Cargo workspace once with warnings denied
        run: cargo clippy --locked --manifest-path '${{ matrix.directory }}/Cargo.toml' --workspace --all-targets ${{ matrix.features }} -- -D warnings
  collaboration-ui:
    name: Collaboration browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: scripts/install-browser.sh
      - run: npm run test:graph --prefix web && npm run test:collaboration --prefix web && npm run test:research --prefix web
      - run: npm run test:ui --prefix web -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - name: Validate required capability browser journeys
        run: python3 scripts/core-capability-evidence.py browser web/test-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: collaboration-browser-evidence
          path: |
            web/test-results/
          if-no-files-found: ignore
  rust-tests:
    name: Rust tests (${{ matrix.partition }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # The slowest of 400 successful shards took 47 min (2026-10-17). A hang that
    # no test bound catches then fails here instead of at the 6 h limit (#320).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition:
          [
            foundation,
            server-unit,
            identity,
            execution,
            persistence,
            collaboration,
            federation,
            knowledge-marketplace,
          ]
        shard: [1, 2]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      AIDASH_COVERAGE_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: rust-coverage
          key: ${{ matrix.partition }}-${{ matrix.shard }}
          workspaces: ". -> target/llvm-cov"
      - name: Install coverage tool
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Verify workspace boundaries and complete test partition inventory
        run: |
          cargo metadata --locked --format-version 1 | python3 scripts/check-workspace-boundaries.py
          python3 scripts/rust-test-partitions.py --check
      - name: Test portable workspace dependency rules
        if: matrix.partition == 'foundation' && matrix.shard == 1
        run: python3 scripts/test_workspace_boundaries.py
      - name: Verify cross-crate coverage collection
        if: matrix.partition == 'foundation' && matrix.shard == 1
        run: python3 scripts/test_rust_test_partitions.py
      - name: Test the selected partition with disposable services and collect LCOV
        run: scripts/test-rust.sh --coverage --partition '${{ matrix.partition }}' --shard '${{ matrix.shard }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-${{ matrix.partition }}-${{ matrix.shard }}
          path: coverage/rust-${{ matrix.partition }}-${{ matrix.shard }}.lcov
          if-no-files-found: error
  rust-coverage:
    name: Rust coverage upload
    needs: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rust-coverage-*
          merge-multiple: true
          path: coverage/parts
      - name: Require every partition's coverage before upload
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import runpy
          contract = runpy.run_path("scripts/rust-test-partitions.py")
          directory = Path("coverage/parts")
          expected = {f"rust-{partition}-{shard}.lcov" for partition in contract["PARTITIONS"] for shard in contract["SHARDS"]}
          actual = {path.name for path in directory.glob("*.lcov") if path.stat().st_size}
          assert actual == expected, (expected - actual, actual - expected)
          with open("coverage/files.txt", "w") as output:
              output.write(",".join(str(directory / name) for name in sorted(expected)))
          PY_CHECK
          echo "files=$(cat coverage/files.txt)" >> "$GITHUB_OUTPUT"
        id: coverage-files
      - name: Upload all Rust partitions to Codecov together
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          use_oidc: true
          # See docs/operations/ci-coverage.md for the CLI download outage and removal condition.
          use_pypi: true
          version: v11.3.1
          files: ${{ steps.coverage-files.outputs.files }}
          flags: rust
          disable_search: true
          fail_ci_if_error: true
  enterprise:
    name: Enterprise workspace
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: enterprise
          workspaces: "enterprise -> target"
      - name: Check that Enterprise composes only Community crates on aligned versions
        run: |
          cargo metadata --locked --format-version 1 --manifest-path enterprise/Cargo.toml | python3 scripts/check-workspace-boundaries.py --workspace enterprise
          python3 scripts/check-enterprise-alignment.py
          python3 -m unittest discover -s scripts -p test_enterprise_alignment.py
      # The GCIP sign-in tests run the Community server's PostgreSQL fixtures,
      # with the environment scripts/test-rust.sh gives Community's.
      - name: Build and test the Enterprise build
        run: |
          scripts/build-test-postgres.sh
          profile=$(mktemp -d)
          printf '{"admission":true,"storage":"%s/storage","outbound_origins":["https://example.com"]}' "$profile" > "$profile/profile.json"
          export AIDASH_CAPABILITY_PROFILE="$profile/profile.json"
          export RUST_TEST_THREADS=2 RUST_MIN_STACK=8388608
          export AIDASH_SECRET_TEST_PEER=local-peer-regression-test-token-0123456789
          export AIDASH_SECRET_GRAPH_THIRD=local-third-graph-peer-token-9876543210
          cargo test --locked --manifest-path enterprise/Cargo.toml --workspace
  community-export:
    name: Community export
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Build and serve the Community build from a tree without enterprise/
        run: scripts/check-community-export.sh
  community-bundle:
    name: Community web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: production-http
      - name: Build the Community dashboard with source maps
        run: npm run build --prefix web -- --sourcemap
      - name: Reject Enterprise code in the Community bundle and its source maps
        run: python3 scripts/check-community-bundle.py web/dist
  enterprise-web:
    name: Enterprise web
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: enterprise
          workspaces: "enterprise -> target"
      - name: Export the Enterprise API contract and generate its client
        run: npm run generate:api --prefix enterprise/web
      - name: Build the Enterprise dashboard with source maps
        run: npm run build --prefix enterprise/web -- --sourcemap
      - name: Check that the Community bundle check rejects the Enterprise bundle
        run: |
          if python3 scripts/check-community-bundle.py enterprise/web/dist 2>"$RUNNER_TEMP/rejected.txt"; then
            echo "the Enterprise bundle passed the Community bundle check" >&2
            exit 1
          fi
          grep -F 'is under enterprise/' "$RUNNER_TEMP/rejected.txt"
          grep -F 'a GCIP name' "$RUNNER_TEMP/rejected.txt"
      - run: scripts/install-browser.sh
      - name: Test GCIP sign-in with the signed SDK fixture
        run: npm run test:gcip --prefix enterprise/web -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: enterprise-web-browser-evidence
          path: enterprise/web/test-results/
          if-no-files-found: ignore
  infrastructure-tests:
    name: Infrastructure contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_check_community_bundle.py
      - run: python3 -m unittest discover -s scripts -p test_transaction_cluster_acceptance.py
      - run: python3 -m unittest discover -s scripts -p test_core_capability_evidence.py
      - run: python3 -m unittest discover -s scripts -p test_golden_path.py
      - run: python3 -m unittest discover -s scripts -p test_ci_success_aggregate.py
      # Fixed-task evaluator (#122): deterministic corpus, oracles and guard rails; no Docker or credentials.
      - run: python3 -m unittest discover -s scripts -p test_fixed_task_evaluation.py
      - run: python3 -m unittest discover -s scripts -p test_evaluate_native_memory.py
      - run: python3 -m unittest discover -s runner -p 'test_*.py'
      # Chart invariants render through Helm and parse the manifests with PyYAML.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s scripts -p test_helm_execution.py
  acceptance:
    name: Federation tests
    runs-on: ubuntu-latest
    # Cold builds and crash recovery precede the serial golden path scenarios.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup show active-toolchain
      - name: Test scoped and legacy federation, Worker crashes and the Chromium golden path goal
        run: scripts/test-acceptance.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-evidence
          include-hidden-files: true
          path: |
            private/acceptance/
            private/dashboard-*.png
            web/test-results/
      - name: Stop verification services
        if: always()
        run: docker compose down
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # A golden path failure must not hide the browser suite, so it runs against the setup alone.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup show active-toolchain
      - name: Test the dashboard in Chromium against freshly set up Nodes
        run: scripts/test-acceptance.sh --browser-suite
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            private/acceptance/
            private/dashboard-*.png
            web/test-results/
      - name: Stop verification services
        if: always()
        run: docker compose down
  bruno:
    name: Bruno API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: production-http
      - name: Validate every route, scenario and sanitized evidence requirement
        run: |
          python3 scripts/bruno_contracts.py --check
          python3 scripts/test_bruno_contracts.py
      - name: Start real PostgreSQL and JetStream fixtures
        run: docker compose up --build -d --wait postgres nats
      - name: Run every HTTP scenario through the native management server
        run: npm exec --yes --package=@usebruno/cli@3.1.3 -- scripts/test-bruno-api.sh
        env:
          AIDASH_BRUNO_OWNER_PASSWORD: aidash-owner-local
          AIDASH_BRUNO_SERVER_PASSWORD: aidash-server-local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bruno-api-evidence
          include-hidden-files: true
          path: private/bruno/
          if-no-files-found: error
      - name: Stop owned verification services
        if: always()
        run: docker compose down -v
  success:
    name: CI Success
    needs:
      [
        gcp-infrastructure,
        lint,
        rust-lint,
        collaboration-ui,
        rust-tests,
        rust-coverage,
        infrastructure-tests,
        enterprise,
        community-export,
        community-bundle,
        enterprise-web,
        bruno,
        acceptance,
        browser,
      ]
    # `always()` runs this required gate after a manual cancellation as well;
    # `needs` then records cancelled prerequisites and the check fails instead of
    # being skipped, which GitHub would treat as satisfied. Concurrency still
    # cancels a superseded run, whose gate now fails rather than staying queued.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require every prerequisite job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("All required CI jobs passed.")
          PY
