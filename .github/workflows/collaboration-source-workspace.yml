name: Collaboration source workspace
on:
  push:
    branches: [feat/issue-14-collaboration-space]
    paths: [.github/workflows/collaboration-source-workspace.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download locked Rust dependencies
        run: |
          cargo fetch --locked
          tar -czf /tmp/cargo-cache.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: collaboration-offline-cargo
          path: /tmp/cargo-cache.tar.gz
          retention-days: 1
      - name: PostgreSQL runtime libraries
        run: |
          mkdir -p /tmp/icu
          cp -L /usr/lib/x86_64-linux-gnu/libicu*.so.74* /tmp/icu/
          tar -czf /tmp/icu.tar.gz -C /tmp icu
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: collaboration-postgres-icu
          path: /tmp/icu.tar.gz
          retention-days: 1
