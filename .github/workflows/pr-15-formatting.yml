name: PR 15 isolated formatting verification
on:
  push:
    branches: [fix/pr-15-formatting-verification]
    paths: [.github/workflows/pr-15-formatting.yml]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'kent8192/aidash' && github.ref == 'refs/heads/fix/pr-15-formatting-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pr-15-formatting-verification
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check source revision and install locked formatter
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm ci --ignore-scripts --prefix web
          test "$(node web/node_modules/prettier/bin/prettier.cjs --version)" = "3.6.2"
      - name: Reproduce formatting failure and apply formatting only
        shell: bash
        run: |
          files=(
            web/src/agent-graph/canvas.tsx
            web/src/agent-graph/copy.ts
            web/src/agent-graph/model.ts
            web/src/agent-graph/style.css
            web/src/agent-graph.tsx
            web/src/entity-details.tsx
            web/src/main.tsx
            web/tests/agent-graph.spec.ts
            web/unit/agent-graph.test.mjs
          )
          set +e
          node web/node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          status=$?
          set -e
          test "$status" -eq 1
          node web/node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node web/node_modules/prettier/bin/prettier.cjs --check "${files[@]}"
          git diff --check
          npm run test:graph --prefix web
          (cd web && npx --no-install eslint src/agent-graph.tsx src/agent-graph/ src/entity-details.tsx src/main.tsx tests/agent-graph.spec.ts unit/agent-graph.test.mjs)
      - name: Preserve the verified formatting tree on the isolated branch
        run: |
          git diff --stat
          git add web/src/agent-graph/canvas.tsx web/src/agent-graph/copy.ts web/src/agent-graph/model.ts web/src/agent-graph/style.css web/src/agent-graph.tsx web/src/entity-details.tsx web/src/main.tsx web/tests/agent-graph.spec.ts web/unit/agent-graph.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(web): format agent relationship graph with Prettier 3.6.2'
          git push origin HEAD:refs/heads/fix/pr-15-formatting-verification
          git log -1 --format='FORMATTED_COMMIT=%H%nFORMATTED_TREE=%T'
