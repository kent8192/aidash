name: Release CI
on:
  push:
    branches: ["develop/**"]

permissions:
  contents: read

concurrency:
  group: release-ci-develop
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release source
    # Reuse the full suite at this exact commit, including native Desktop checks.
    # These grants bound the reusable jobs' existing permissions; coverage uses OIDC.
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/ci.yml
