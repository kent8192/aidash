name: Collaboration verification workspace
on:
  push:
    branches: [feat/issue-14-collaboration-space]
    paths: [.github/workflows/collaboration-workspace.yml]
permissions:
  contents: read
jobs:
  lock-object:
    if: github.repository == 'kent8192/aidash' && github.ref == 'refs/heads/feat/issue-14-collaboration-space'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Produce dependency lock
        run: |
          npm ci --ignore-scripts --prefix web
          npm install --ignore-scripts --prefix web --save-exact cytoscape@3.34.1
          git hash-object web/package-lock.json
      - name: Publish lock blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/kent8192/aidash/git/blobs --method POST -f encoding=utf-8 -F content=@web/package-lock.json --jq .sha
