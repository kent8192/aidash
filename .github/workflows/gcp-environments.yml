name: GCP environments
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [create, resume, stop, destroy, verify-boundaries]
        required: true
      environment:
        type: choice
        options: [develop, test, pr]
        required: true
      source_ref:
        description: "Test branch/SHA; blank resume keeps its pinned SHA"
        type: string
      pr_number:
        description: "Required for environment=pr"
        type: string
      vm_mode:
        type: choice
        options: [default, spot, normal]
        description: "Node pool mode; default preserves the existing mode, new test/PR defaults to Spot"
      approved_sha:
        description: "Full reviewed head SHA required for a fork PR"
        type: string
      force:
        description: "Explicitly permit interrupting active work for this operation"
        type: boolean
        default: false
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Release CI]
    types: [completed]
  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  contents: read

# No workflow-wide concurrency group: GitHub may discard pending runs in such
# groups. Intent acceptance and applies share a durable GCS lock, with state
# updated using compare-and-swap. Builds cannot overwrite a newer generation.
jobs:
  # These are negative experiments, not deployment jobs. The protected dispatch
  # omits Environment entirely; an unprotected dispatch declares nonproduction
  # so GitHub's branch policy can refuse it before any runner/OIDC request exists.
  # Do not relax that policy to make the second experiment reach Google.
  wif-without-environment:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'verify-boundaries' &&
      github.ref == 'refs/heads/develop/0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require provider denial from the protected workflow without Environment
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          python3 infra/gcp/sandbox/wif_probe.py
          --case protected-ref-without-environment
          --evidence "$RUNNER_TEMP/wif-evidence/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wif-without-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wif-evidence/result.json
          if-no-files-found: error
          retention-days: 30

  wif-unprotected-ref:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'verify-boundaries' &&
      github.ref != 'refs/heads/develop/0.1.0'
    runs-on: ubuntu-24.04
    environment: nonproduction
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require provider denial if Environment branch protection admits this job
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          python3 infra/gcp/sandbox/wif_probe.py
          --case unprotected-ref-with-environment
          --evidence "$RUNNER_TEMP/wif-evidence/result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: wif-unprotected-ref-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wif-evidence/result.json
          if-no-files-found: error
          retention-days: 30

  intake:
    if: >-
      inputs.action != 'verify-boundaries' &&
      vars.GCP_ENVIRONMENTS_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview ') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.filter.outputs.proceed }}
      # Every later job checks out this one protected default-branch commit, so
      # the trusted images, charts and controller of a run cannot diverge if the
      # branch advances while jobs are scheduled.
      trusted: ${{ steps.trusted.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/${TRUSTED_BRANCH//\//%2F}" > "$RUNNER_TEMP/trusted-branch.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          branch = json.loads((Path(os.environ['RUNNER_TEMP']) / 'trusted-branch.json').read_text())
          sha = branch['commit']['sha']
          if not branch.get('protected') or not re.fullmatch('[a-f0-9]{40}', sha):
              raise SystemExit('The CD code anchor must be the protected default branch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/gcp/control/controller.py preflight
      - name: Record the exact staging attempt before credentialed work
        if: >-
          steps.filter.outputs.proceed == 'true' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Release CI'
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOP_BRANCH: ${{ fromJSON(vars.AIDASH_GCP_CONFIG || '{}').develop_branch }}
        run: python3 infra/gcp/control/releases.py attempt
      - name: Publish the bounded staging attempt identity
        if: >-
          steps.filter.outputs.proceed == 'true' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Release CI'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-attempt
          overwrite: true
          path: ${{ runner.temp }}/staging-attempt.json
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: intake
    if: needs.intake.outputs.proceed == 'true'
    # Every credentialed job runs in the protected `nonproduction` Environment;
    # the WIF provider trusts no other Environment for this workflow (#151).
    runs-on: ubuntu-24.04
    environment: nonproduction
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      sha: ${{ steps.prepare.outputs.sha }}
      source_repo: ${{ steps.prepare.outputs.source_repo }}
    env:
      GH_TOKEN: ${{ github.token }}
      AIDASH_GCP_CONFIG: ${{ vars.AIDASH_GCP_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.trusted }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - id: prepare
        run: python3 infra/gcp/control/controller.py prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-request-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/aidash-request.json
          retention-days: 1

  build:
    needs: [intake, prepare]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # images.py builds app/postgres/sandbox from source; observer/control/edge
        # only from the trusted checkout; nats/caddy are reviewed upstream digests.
        image: [app, postgres, sandbox, observer, nats, control, edge, caddy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.trusted }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Build inside Docker without cloud credentials
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE_KIND: ${{ matrix.image }}
        run: python3 trusted/infra/gcp/control/images.py build --kind "$IMAGE_KIND" --sha "$SOURCE_SHA" --source "$GITHUB_WORKSPACE/source" --directory "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-image-${{ matrix.image }}-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/images/*.tar
          retention-days: 1
          compression-level: 1

  publish:
    needs: [intake, prepare, build]
    runs-on: ubuntu-24.04
    environment: nonproduction
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AIDASH_GCP_CONFIG: ${{ vars.AIDASH_GCP_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.trusted }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gcp-image-*-${{ github.run_id }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Authenticate the archive publisher
        env:
          REGISTRY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
      - name: Publish immutable image digests without running the images
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 infra/gcp/control/images.py publish --sha "$SOURCE_SHA" --directory "$RUNNER_TEMP/images"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-release-${{ github.run_id }}
          overwrite: true
          path: ${{ runner.temp }}/images/release.json
          retention-days: 1

  apply:
    needs: [intake, prepare, build, publish]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.build != 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-24.04
    environment: nonproduction
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      AIDASH_GCP_CONFIG: ${{ vars.AIDASH_GCP_CONFIG }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
      AIDASH_RUNTIME_DEVELOP: ${{ secrets.GCP_DEVELOP_RUNTIME_CONFIG }}
      AIDASH_RUNTIME_TEST: ${{ secrets.GCP_TEST_RUNTIME_CONFIG }}
      AIDASH_RUNTIME_PR: ${{ secrets.GCP_PR_RUNTIME_CONFIG }}
      AIDASH_GCIP_IDP_SECRETS: ${{ secrets.GCP_GCIP_IDP_SECRETS }}
      AIDASH_DEMO_DATA: ${{ secrets.GCP_DEMO_DATA }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.intake.outputs.trusted }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: kubectl,gke-gcloud-auth-plugin
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.prepare.outputs.build == 'true'
        with:
          name: gcp-request-${{ github.run_id }}
          path: ${{ runner.temp }}/request
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.prepare.outputs.build == 'true'
        with:
          name: gcp-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release
      - name: Reconcile the latest durable intent
        env:
          HAS_BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          if [ "$HAS_BUILD" = true ]; then
            request_file="$RUNNER_TEMP/request/aidash-request.json"
            release_file="$RUNNER_TEMP/release/release.json"
            test -s "$request_file"
            test -s "$release_file"
            python3 infra/gcp/control/controller.py finish --request "$request_file" --release "$release_file"
          else
            python3 infra/gcp/control/controller.py reconcile
          fi
      - name: Export sanitized staging evidence
        run: python3 infra/gcp/control/controller.py receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-receipt
          path: ${{ runner.temp }}/staging-receipt.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
